<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>하늘섬 탐험가</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bdcff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 5px #17405e}#top{position:absolute;top:16px;left:16px;font-weight:800;font-size:19px}#count{position:absolute;top:18px;right:18px;background:#164d70aa;padding:9px 14px;border-radius:20px;font-weight:700}#area{position:absolute;top:62px;right:18px;background:#164d7066;padding:6px 10px;border-radius:14px;font-size:12px}#hint{position:absolute;top:58px;left:16px;font-size:13px}#joystick{position:absolute;bottom:24px;left:24px;width:116px;height:116px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff99;pointer-events:auto}#stick{position:absolute;width:48px;height:48px;left:32px;top:32px;border-radius:50%;background:#fff9;box-shadow:0 2px 8px #245}#jump{position:absolute;bottom:35px;right:28px;width:78px;height:78px;border:0;border-radius:50%;background:#ffcf58;color:#5a3b00;font-weight:900;font-size:16px;pointer-events:auto;box-shadow:0 5px 0 #c58b27}#toast{position:absolute;top:45%;width:100%;text-align:center;font-size:25px;font-weight:900;opacity:0;transition:opacity .2s}#start{position:fixed;inset:0;background:linear-gradient(#65b9edaa,#244f76aa);display:grid;place-items:center;color:white;text-align:center}#panel{padding:28px;border-radius:24px;background:#164d70dd;max-width:330px;margin:20px}#panel h1{margin:0 0 10px;font-size:27px}#panel p{line-height:1.6}#go{border:0;border-radius:30px;padding:14px 30px;background:#ffcf58;font-size:17px;font-weight:900;color:#513500}#inventoryBtn{position:absolute;right:18px;top:112px;pointer-events:auto;border:0;border-radius:16px;padding:10px 14px;background:#164d70dd;color:white;font-weight:800}#quest{position:absolute;left:16px;top:88px;background:#164d70d9;padding:11px 13px;border-radius:14px;font-size:13px;line-height:1.65;min-width:145px;pointer-events:auto}#questClaim{border:0;border-radius:10px;padding:7px 10px;background:#ffcf58;color:#513500;font-weight:800;margin-top:5px}#questClaim:disabled{opacity:.45}#inventory{display:none;position:absolute;right:16px;top:158px;width:220px;background:#123d5bea;border:1px solid #ffffff77;border-radius:18px;padding:14px;pointer-events:auto}#inventory.open{display:block}.invHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.invHead button{border:0;border-radius:8px;padding:5px 8px}.invItem{display:flex;justify-content:space-between;background:#ffffff20;padding:10px;border-radius:10px;margin:7px 0}#saveStatus{font-size:11px;opacity:.8;margin:10px 0 0}#talkBtn{display:none;position:absolute;left:50%;bottom:155px;transform:translateX(-50%);pointer-events:auto;border:0;border-radius:20px;padding:11px 19px;background:#fff0a8;color:#593d08;font-weight:900}#dialog{display:none;position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(92%,390px);padding:16px;background:#123d5bf2;border:1px solid #ffffff88;border-radius:18px;pointer-events:auto;color:white;text-shadow:none}#dialog.open{display:block}#dialogTitle{font-weight:900;font-size:17px;margin-bottom:7px}#dialogText{font-size:14px;line-height:1.55;margin-bottom:12px}#dialogActions{display:flex;gap:8px;justify-content:flex-end}#dialogActions button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;background:#ffcf58;color:#513500}#dialogActions #dialogClose{background:#e7eef4;color:#29445a}
</style>
</head>
<body>
<div id="hud"><div id="top">☁️ 하늘섬 탐험가</div><div id="count">💎 0 / 16</div><div id="area">첫 번째 섬</div><div id="hint">섬 곳곳의 빛나는 수정을 모아 보세요</div><button id="inventoryBtn">🎒 가방</button><button id="talkBtn">💬 안내자와 대화</button><div id="dialog"><div id="dialogTitle">섬의 안내자</div><div id="dialogText"></div><div id="dialogActions"><button id="dialogClose">닫기</button><button id="dialogAction">의뢰 수락</button></div></div><div id="quest"><b>📜 첫 번째 의뢰</b><div>수정 5개 모으기</div><div id="questProgress">0 / 5</div><button id="questClaim" disabled>보상 받기</button></div><div id="inventory"><div class="invHead"><b>🎒 탐험 가방</b><button id="inventoryClose">닫기</button></div><div class="invItem">💎 하늘 수정 <b id="invCrystals">0</b></div><div class="invItem">✨ 별가루 <b id="invDust">0</b></div><p id="saveStatus">자동 저장 사용 중</p></div><div id="joystick"><div id="stick"></div></div><button id="jump">점프</button><div id="toast">모든 수정 수집 완료!</div></div>
<div id="start"><div id="panel"><h1>하늘섬 탐험가</h1><p>구름 위에 떠 있는 신비한 섬을 탐험하고<br>숨겨진 수정을 모아 보세요!</p><button id="go">탐험 시작</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91d5fa);scene.fog=new THREE.Fog(0x91d5fa,35,100);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,150);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff5ff,0x65845e,2));const sun=new THREE.DirectionalLight(0xfff1cf,2.5);sun.position.set(-8,18,10);sun.castShadow=true;scene.add(sun);
const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grass=mat(0x68b86d),rock=mat(0x786b80),sand=mat(0x9c8b79),wood=mat(0x805331),leaf=mat(0x328c68),white=mat(0xffffff),gold=mat(0xffd84d,.3);
const island=new THREE.Group();scene.add(island);
const top=new THREE.Mesh(new THREE.CylinderGeometry(10,7.4,2.3,9,1),grass);top.position.y=0;top.receiveShadow=true;top.castShadow=true;island.add(top);
const under=new THREE.Mesh(new THREE.ConeGeometry(7.5,8,9),rock);under.position.y=-5;under.rotation.y=.2;under.castShadow=true;island.add(under);
const ring=new THREE.Mesh(new THREE.TorusGeometry(9.7,.12,8,80),gold);ring.rotation.x=Math.PI/2;ring.position.y=1.18;island.add(ring);
function tree(x,z,s=1){let g=new THREE.Group();let t=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.28*s,1.5*s,7),wood);t.position.y=.75*s;t.castShadow=true;g.add(t);for(let i=0;i<3;i++){let l=new THREE.Mesh(new THREE.ConeGeometry((1.0-i*.16)*s,1.5*s,7),leaf);l.position.y=(1.5+i*.55)*s;l.castShadow=true;g.add(l)}g.position.set(x,1.05,z);island.add(g)}
for(const p of [[-5,-3,1.1],[5,-3,.9],[-6,3,.8],[4,5,1.1],[0,-6,.7]])tree(...p);
for(let i=0;i<13;i++){let a=i*2.4,r=3.8+(i%4)*1.25;let b=new THREE.Mesh(new THREE.DodecahedronGeometry(.45+(i%3)*.18,0),i%2?rock:sand);b.position.set(Math.cos(a)*r,1.2,Math.sin(a)*r);b.castShadow=true;island.add(b)}

function sideIsland(x, tint=0x68b86d){
  const group=new THREE.Group(); group.position.x=x; scene.add(group);
  const turf=new THREE.Mesh(new THREE.CylinderGeometry(8.5,6.6,2.3,10),mat(tint));
  turf.receiveShadow=true; turf.castShadow=true; group.add(turf);
  const base=new THREE.Mesh(new THREE.ConeGeometry(6.7,7,10),rock);
  base.position.y=-4.6; base.rotation.y=.25; base.castShadow=true; group.add(base);
  const halo=new THREE.Mesh(new THREE.TorusGeometry(8.25,.1,8,64),gold);
  halo.rotation.x=Math.PI/2; halo.position.y=1.17; group.add(halo);
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2+.4, rr=4.7;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.14,.22,1.2,7),wood);
    trunk.position.set(Math.cos(a)*rr,.6,Math.sin(a)*rr); trunk.castShadow=true; group.add(trunk);
    const crown=new THREE.Mesh(new THREE.ConeGeometry(.85,1.8,7),leaf);
    crown.position.set(Math.cos(a)*rr,1.9,Math.sin(a)*rr); crown.castShadow=true; group.add(crown);
  }
  for(let i=0;i<7;i++){
    const a=i*2.4, rr=3.2+(i%3)*1.1;
    const stone=new THREE.Mesh(new THREE.DodecahedronGeometry(.4+(i%2)*.16),i%2?rock:sand);
    stone.position.set(Math.cos(a)*rr,1.15,Math.sin(a)*rr); group.add(stone);
  }
  return group;
}
sideIsland(-19,0x79bd78); sideIsland(19,0x5eaa80);
for(const x of [-10.25,10.25]){
  const bridge=new THREE.Mesh(new THREE.BoxGeometry(1.15,.35,2.8),wood);
  bridge.position.set(x,1.0,0); bridge.castShadow=true; bridge.receiveShadow=true; scene.add(bridge);
  for(let side of [-1,1]){
    const rail=new THREE.Mesh(new THREE.BoxGeometry(1.15,.28,.12),gold);
    rail.position.set(x,1.28,side*1.35); scene.add(rail);
  }
}
const clouds=new THREE.Group();scene.add(clouds);for(let i=0;i<24;i++){let g=new THREE.Group();for(let j=0;j<5;j++){let m=new THREE.Mesh(new THREE.SphereGeometry(1.2+Math.random()*.7,12,10),white);m.position.set((j-2)*.9,Math.random()*.5,Math.random()*.5);g.add(m)}g.position.set((Math.random()-.5)*75,-8-Math.random()*8,(Math.random()-.5)*75);g.scale.setScalar(.8+Math.random()*1.2);clouds.add(g)}
const guide=new THREE.Group();guide.position.set(0,1.2,-2.2);scene.add(guide);const guideRobe=new THREE.Mesh(new THREE.ConeGeometry(.58,1.45,8),mat(0x7654a8));guideRobe.position.y=.72;guideRobe.castShadow=true;guide.add(guideRobe);const guideHead=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),mat(0xffd2a5));guideHead.position.y=1.65;guideHead.castShadow=true;guide.add(guideHead);const guideHat=new THREE.Mesh(new THREE.ConeGeometry(.48,.65,8),mat(0x294b79));guideHat.position.y=2.15;guideHat.castShadow=true;guide.add(guideHat);const guideBadge=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),gold);guideBadge.position.set(0,1.05,.48);guide.add(guideBadge);const guideMark=new THREE.Mesh(new THREE.SphereGeometry(.2,12,10),gold);guideMark.position.y=2.85;guide.add(guideMark);const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,4,8),mat(0x2865a8));body.position.y=.95;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),mat(0xffd2a5));head.position.y=1.75;head.castShadow=true;player.add(head);const pack=new THREE.Mesh(new THREE.BoxGeometry(.55,.65,.25),mat(0x9b5b32));pack.position.set(0,1.05,-.42);player.add(pack);player.position.set(0,1.2,5);

const crystals=[];
const crystalSpots=[];
for(let i=0;i<8;i++){const a=i*Math.PI*2/8+.3,r=4.8+(i%2)*1.3;crystalSpots.push([Math.cos(a)*r,0,Math.sin(a)*r])}
for(const cx of [-19,19]){
  for(let i=0;i<4;i++){const a=i*Math.PI/2+.55,r=4.1+(i%2)*1.1;crystalSpots.push([cx+Math.cos(a)*r,0,Math.sin(a)*r])}
}
for(const [x,_,z] of crystalSpots){
  const c=new THREE.Mesh(new THREE.OctahedronGeometry(.58),new THREE.MeshStandardMaterial({color:0x62f4ff,emissive:0x16a9e8,emissiveIntensity:1.5,metalness:.25,roughness:.2}));
  c.position.set(x,2,z);c.userData.baseY=2;c.castShadow=true;scene.add(c);crystals.push(c);
}
let saveData={collected:[],dust:0,questClaimed:false,forestQuestAccepted:false,forestQuestClaimed:false,forestIslandVisited:false,player:{x:0,y:1.2,z:5}};
try{const raw=localStorage.getItem('skyIslandSaveV2');if(raw)saveData={...saveData,...JSON.parse(raw)}}catch(e){}
let collected=Array.isArray(saveData.collected)?saveData.collected.length:0,started=false,moveX=0,moveY=0,vy=0,onGround=true,yaw=0,camYaw=0,lastX=0,lastY=0,drag=false;
crystals.forEach((c,i)=>{if(saveData.collected.includes(i))c.visible=false});
player.position.set(saveData.player?.x??0,1.2,saveData.player?.z??5);
const countEl=document.querySelector('#count'),invCrystals=document.querySelector('#invCrystals'),invDust=document.querySelector('#invDust'),questProgress=document.querySelector('#questProgress'),questClaim=document.querySelector('#questClaim');
function updatePanels(){
 countEl.textContent='💎 '+collected+' / 16';invCrystals.textContent=collected;invDust.textContent=saveData.dust||0;
 const questBox=document.querySelector('#quest');
 if(!saveData.questClaimed){
  questBox.querySelector('b').textContent='📜 첫 번째 의뢰';
  questBox.children[1].textContent='수정 5개 모으기';
  questProgress.textContent=Math.min(collected,5)+' / 5';
  questClaim.disabled=collected<5;
  questClaim.textContent='보상 받기';
  questBox.style.display='block';
 }else if(saveData.forestQuestAccepted&&!saveData.forestQuestClaimed){
  questBox.querySelector('b').textContent='📜 안내자의 의뢰';
  questBox.children[1].textContent='동쪽 숲섬 도착 + 수정 3개';
  questProgress.textContent=(saveData.forestIslandVisited?'섬 탐험 완료':'섬 미방문')+' · '+Math.min(collected,3)+' / 3';
  questClaim.disabled=!(saveData.forestIslandVisited&&collected>=3);
  questClaim.textContent='별가루 5개 받기';
  questBox.style.display='block';
 }else{questBox.style.display='none'}
}
function saveGame(){saveData.collected=crystals.map((c,i)=>c.visible?null:i).filter(i=>i!==null);saveData.player={x:player.position.x,z:player.position.z};try{localStorage.setItem('skyIslandSaveV2',JSON.stringify(saveData));document.querySelector('#saveStatus').textContent='자동 저장 완료'}catch(e){document.querySelector('#saveStatus').textContent='이 기기에서는 저장할 수 없어요'}}
updatePanels();
const talkBtn=document.querySelector('#talkBtn'),dialog=document.querySelector('#dialog'),dialogText=document.querySelector('#dialogText'),dialogAction=document.querySelector('#dialogAction');
function forestQuestDone(){return !!saveData.forestIslandVisited&&collected>=3}
function refreshGuideQuest(){
if(saveData.forestQuestClaimed){dialogText.textContent='동쪽 숲섬을 잘 다녀왔구나! 약속한 별가루 5개는 네 것이란다.';dialogAction.textContent='보상 수령 완료';dialogAction.disabled=true}
else if(!saveData.forestQuestAccepted){dialogText.textContent='안녕, 탐험가! 동쪽 숲섬에 오래된 길의 표식이 있단다. 그곳까지 가서 하늘 수정을 3개 이상 모아 오겠니? 임무를 마치면 별가루 5개를 주마.';dialogAction.textContent='의뢰 수락';dialogAction.disabled=false}
else if(forestQuestDone()){dialogText.textContent='훌륭하구나! 동쪽 숲섬을 탐험하고 수정도 충분히 모았어. 약속한 보상을 받아 가렴.';dialogAction.textContent='별가루 5개 받기';dialogAction.disabled=false}
else{dialogText.textContent='동쪽 숲섬에 도착하고 하늘 수정을 총 3개 이상 모아 오렴. 현재 '+(saveData.forestIslandVisited?'섬 탐험 완료':'섬에 아직 도착하지 않음')+' · 수정 '+collected+' / 3';dialogAction.textContent='의뢰 진행 중';dialogAction.disabled=true}}
talkBtn.addEventListener('click',()=>{refreshGuideQuest();dialog.classList.add('open');talkBtn.style.display='none'});
document.querySelector('#dialogClose').addEventListener('click',()=>dialog.classList.remove('open'));
dialogAction.addEventListener('click',()=>{if(!saveData.forestQuestAccepted){saveData.forestQuestAccepted=true;refreshGuideQuest();saveGame()}else if(!saveData.forestQuestClaimed&&forestQuestDone()){saveData.forestQuestClaimed=true;saveData.dust=(saveData.dust||0)+5;refreshGuideQuest();updatePanels();saveGame();const t=document.querySelector('#toast');t.textContent='✨ 별가루 5개 획득!';t.style.opacity=1;setTimeout(()=>{t.style.opacity=0;t.textContent='모든 수정 수집 완료!'},2200)}});
document.querySelector('#inventoryBtn').addEventListener('click',()=>document.querySelector('#inventory').classList.toggle('open'));
document.querySelector('#inventoryClose').addEventListener('click',()=>document.querySelector('#inventory').classList.remove('open'));
questClaim.addEventListener('click',()=>{
 let reward=0,message='';
 if(!saveData.questClaimed&&collected>=5){saveData.questClaimed=true;reward=3;message='✨ 별가루 3개 획득!'}
 else if(saveData.forestQuestAccepted&&!saveData.forestQuestClaimed&&saveData.forestIslandVisited&&collected>=3){saveData.forestQuestClaimed=true;reward=5;message='✨ 별가루 5개 획득!'}
 if(reward){saveData.dust=(saveData.dust||0)+reward;updatePanels();saveGame();const t=document.querySelector('#toast');t.textContent=message;t.style.opacity=1;setTimeout(()=>{t.style.opacity=0;t.textContent='모든 수정 수집 완료!'},2200)}
});

const joy=document.querySelector('#joystick'),stick=document.querySelector('#stick');
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.buttons)joyMove(e)});function joyMove(e){let r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.hypot(x,y),k=Math.min(1,48/(d||1));x*=k;y*=k;stick.style.transform=`translate(${x}px,${y}px)`;moveX=x/48;moveY=y/48}function joyReset(){moveX=moveY=0;stick.style.transform='translate(0,0)'}joy.addEventListener('pointerup',joyReset);joy.addEventListener('pointercancel',joyReset);
document.querySelector('#jump').addEventListener('pointerdown',()=>{if(onGround){vy=7.5;onGround=false}});
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.35){drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(drag){camYaw-=(e.clientX-lastX)*.006;lastX=e.clientX;lastY=e.clientY}});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
document.querySelector('#go').onclick=()=>{started=true;document.querySelector('#start').style.display='none'};
const clock=new THREE.Clock();let elapsed=0,lastAutoSave=0;
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);elapsed+=dt;
crystals.forEach((c,i)=>{if(c.visible){c.rotation.y+=dt*1.5;c.position.y=c.userData.baseY+Math.sin(elapsed*2+i)*.2}});
clouds.position.x=Math.sin(elapsed*.04)*2;
if(started){let guideDistance=player.position.distanceTo(guide.position);talkBtn.style.display=guideDistance<3.6&&!dialog.classList.contains('open')?'block':'none';if(dialog.classList.contains('open')&&saveData.forestQuestAccepted&&!saveData.forestQuestClaimed)refreshGuideQuest();if(saveData.questClaimed&&saveData.forestQuestAccepted&&!saveData.forestQuestClaimed)updatePanels();let forward=new THREE.Vector3(-Math.sin(camYaw),0,-Math.cos(camYaw)),right=new THREE.Vector3(Math.cos(camYaw),0,-Math.sin(camYaw));let dir=forward.multiplyScalar(-moveY).add(right.multiplyScalar(moveX));if(dir.length()>1)dir.normalize();const prevX=player.position.x,prevZ=player.position.z;player.position.addScaledVector(dir,dt*5);player.position.x=THREE.MathUtils.clamp(player.position.x,-27.5,27.5);player.position.z=THREE.MathUtils.clamp(player.position.z,-8.5,8.5);const px=player.position.x,pz=player.position.z;const onMain=px*px+pz*pz<=9.55*9.55;const onWest=(px+19)*(px+19)+pz*pz<=8.0*8.0;const onEast=(px-19)*(px-19)+pz*pz<=8.0*8.0;const onBridge=Math.abs(Math.abs(px)-10.25)<=.8&&Math.abs(pz)<=1.55;if(!onMain&&!onWest&&!onEast&&!onBridge){player.position.x=prevX;player.position.z=prevZ;dir.set(0,0,0)}if(dir.lengthSq()>.01)player.rotation.y=Math.atan2(dir.x,dir.z);document.querySelector('#area').textContent=player.position.x < -9 ? '서쪽 수정섬' : player.position.x > 9 ? '동쪽 숲섬' : '첫 번째 섬';if(player.position.x>13&&!saveData.forestIslandVisited){saveData.forestIslandVisited=true;saveGame();updatePanels()}vy-=18*dt;player.position.y+=vy*dt;if(player.position.y<=1.2){player.position.y=1.2;vy=0;onGround=true}
for(const c of crystals){if(c.visible&&player.position.distanceTo(c.position)<1.35){c.visible=false;collected++;updatePanels();saveGame();if(collected===16){let t=document.querySelector('#toast');t.style.opacity=1;setTimeout(()=>t.style.opacity=0,3000)}}}}
if(started&&elapsed-lastAutoSave>2){saveGame();lastAutoSave=elapsed}
let target=new THREE.Vector3(player.position.x,player.position.y+1.2,player.position.z);let dist=9;camera.position.set(target.x+Math.sin(camYaw)*dist,target.y+5,target.z+Math.cos(camYaw)*dist);camera.lookAt(target);renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
